name: Collect RSS Candidates

on:
  schedule:
    # Beijing time 05:17
    - cron: "17 21 * * *"
    # Beijing time 06:17
    - cron: "17 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect-rss:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Collect RSS
        run: python scripts/collect_rss.py

      - name: Commit and Push JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news-candidates/ data/learning-candidates/ data/history/ || true
          if git diff --staged --quiet; then
            echo "No JSON changes to commit."
            exit 0
          fi
          git commit -m "chore: update RSS news and learning candidates"
          git push
